[[command]]
name = "cargo fmt --check"
cmd = ["cargo", "fmt", "--check"]
expect_exit = 0
timeout_secs = 120

[[command]]
name = "cargo clippy"
cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 120

[[command]]
name = "cargo test"
cmd = ["cargo", "test", "--all-targets"]
expect_exit = 0
timeout_secs = 120
stdout_contains = ["test result: ok"]

[[command]]
name = "cargo build"
cmd = ["cargo", "build"]
expect_exit = 0
timeout_secs = 120
